<!doctype html>
<!--
  The page an owner opens from a password reset link (/reset#<token>). The token rides in the URL
  fragment, which browsers never send to a server, so it stays out of request logs. Everything about
  the gym (name, colour, logo, email) comes from /v1/auth/reset/check at runtime.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Set a new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #2F45FF; --on-brand: #fff;
    --bg: #F6F6F8; --card: #fff; --ink: #14151A; --soft: #5D5F6B; --line: #8A8C99; --danger: #C62828; --ok: #1B7F3B;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1014; --card: #1A1B21; --ink: #F2F2F5; --soft: #A6A8B4; --line: #6E7080; --danger: #FF6B6B; --ok: #5BD48A; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Figtree, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  .plate { background: var(--brand); color: var(--on-brand); padding: calc(env(safe-area-inset-top) + 40px) 20px 56px; }
  .plate .in, main { max-width: 440px; margin: 0 auto; }
  .logo { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: rgba(255,255,255,.15); display: block; margin-bottom: 16px; }
  .gym { font: 600 14px/1.3 Figtree, sans-serif; letter-spacing: .02em; opacity: .85; margin: 0 0 6px; }
  h1 { font: 700 30px/1.15 'Bricolage Grotesque', Figtree, sans-serif; margin: 0; }
  main { padding: 0 16px 40px; margin-top: -28px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); }
  .who { color: var(--soft); margin: 0 0 20px; overflow-wrap: anywhere; }
  .who b { color: var(--ink); font-weight: 600; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .field { position: relative; margin-bottom: 16px; }
  input[type=password], input[type=text] { width: 100%; font: inherit; color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 64px 12px 14px; min-height: 48px; }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
  .show { position: absolute; right: 6px; top: 6px; height: 36px; padding: 0 10px; border: 0; background: none; color: var(--soft); font: 600 14px Figtree, sans-serif; cursor: pointer; border-radius: 8px; }
  .hint { color: var(--soft); font-size: 14px; margin: -8px 0 16px; }
  .err { color: var(--danger); font-size: 14px; margin: 0 0 14px; }
  .err:empty { display: none; }
  button.go { width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--brand); color: var(--on-brand); font: 600 16px Figtree, sans-serif; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: default; }
  .msg h2 { font: 700 22px/1.2 'Bricolage Grotesque', Figtree, sans-serif; margin: 0 0 8px; }
  .msg p { margin: 0; color: var(--soft); overflow-wrap: anywhere; }
  .msg p b { color: var(--ink); }
  .tick { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); font-size: 22px; margin-bottom: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="plate"><div class="in">
  <img class="logo" id="logo" alt="" hidden>
  <p class="gym" id="gym">&nbsp;</p>
  <h1 id="title">Set a new password</h1>
</div></header>
<main><div class="card">
  <p class="msg" id="loading">Checking your link…</p>

  <form id="form" hidden novalidate>
    <p class="who">For the owner account <b id="email"></b></p>
    <input type="text" id="username" autocomplete="username" hidden>
    <label for="pw">New password</label>
    <div class="field">
      <input type="password" id="pw" autocomplete="new-password" minlength="8" maxlength="100" required>
      <button type="button" class="show" id="show" aria-label="Show password">Show</button>
    </div>
    <p class="hint">At least 8 characters.</p>
    <label for="pw2">Type it again</label>
    <div class="field"><input type="password" id="pw2" autocomplete="new-password" maxlength="100" required></div>
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="go" type="submit">Save new password</button>
  </form>

  <div class="msg" id="done" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h2>Password changed</h2>
    <p>Sign in again with <b id="doneEmail"></b> and your new password. You’ve been signed out on every other phone and computer.</p>
  </div>

  <div class="msg" id="gone" hidden>
    <h2>This link doesn’t work any more</h2>
    <p id="goneText">It has expired or was already used. Ask for a new one.</p>
  </div>
</div></main>
<script nonce="__NONCE__">
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = decodeURIComponent((location.hash || '').slice(1));
  var shown = function (id) { ['loading', 'form', 'done', 'gone'].forEach(function (k) { $(k).hidden = k !== id; }); };
  var gone = function (text) { if (text) $('goneText').textContent = text; shown('gone'); };

  function brand(hex) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return;
    var n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255].map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    var lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    var root = document.documentElement.style;
    root.setProperty('--brand', hex);
    root.setProperty('--on-brand', (1.05 / (lum + 0.05)) >= 4.5 ? '#fff' : '#14151A');
  }

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, data: d }; }); });
  }

  if (!token) return gone('This link is incomplete. Open the whole link from your message, or ask for a new one.');

  post('/v1/auth/reset/check', { token: token }).then(function (r) {
    if (r.status !== 200) return gone(r.data.message);
    var d = r.data;
    brand(d.primaryColor);
    $('gym').textContent = d.gymName || '';
    document.title = 'Set a new password · ' + (d.gymName || '');
    if (d.logoUrl) { $('logo').onerror = function () { this.hidden = true; }; $('logo').src = d.logoUrl; $('logo').hidden = false; }
    $('email').textContent = d.email || '';
    $('username').value = d.email || '';
    shown('form');
    $('pw').focus();
  }, function () { gone('Couldn’t reach the server. Check your internet and open the link again.'); });

  $('show').onclick = function () {
    var hide = $('pw').type === 'text';
    $('pw').type = $('pw2').type = hide ? 'password' : 'text';
    this.textContent = hide ? 'Show' : 'Hide';
    this.setAttribute('aria-label', hide ? 'Show password' : 'Hide password');
  };

  $('form').onsubmit = function (e) {
    e.preventDefault();
    var pw = $('pw').value, err = $('err');
    if (pw.length < 8) { err.textContent = 'Use at least 8 characters.'; return $('pw').focus(); }
    if (pw !== $('pw2').value) { err.textContent = 'The two passwords don’t match.'; return $('pw2').focus(); }
    err.textContent = '';
    $('go').disabled = true; $('go').textContent = 'Saving…';
    post('/v1/auth/reset', { token: token, password: pw }).then(function (r) {
      if (r.status === 200) { $('doneEmail').textContent = r.data.email || $('email').textContent; $('title').textContent = 'All set'; history.replaceState(null, '', location.pathname); return shown('done'); }
      if (r.status === 410) return gone(r.data.message);
      err.textContent = r.data.message || 'Something went wrong. Try again.';
      $('go').disabled = false; $('go').textContent = 'Save new password';
    }, function () {
      err.textContent = 'Couldn’t reach the server. Check your internet and try again.';
      $('go').disabled = false; $('go').textContent = 'Save new password';
    });
  };
})();
</script>
</body>
</html>
