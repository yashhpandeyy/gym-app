# Deploys the API in /server to your Cloudflare account: applies database migrations to D1,
# publishes the Worker and sets its secrets. Runs on every push to master that touches /server,
# and on demand from the Actions tab ("Run workflow").
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
#   D1_DATABASE_ID         id of the gym-db database (Storage & Databases > D1)
#   APP_SECRET             long random string; never change it once gyms are live
#   ADMIN_TOKEN            long random string for admin scripts
name: Deploy API

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Point wrangler.toml at your D1 database
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "Set the D1_DATABASE_ID repository secret."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
      - run: npx wrangler d1 migrations apply gym-db --remote
      - run: npx wrangler deploy
      - name: Set Worker secrets
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$APP_SECRET" && test -n "$ADMIN_TOKEN" || { echo "Set the APP_SECRET and ADMIN_TOKEN repository secrets."; exit 1; }
          node -e 'process.stdout.write(JSON.stringify({ APP_SECRET: process.env.APP_SECRET, ADMIN_TOKEN: process.env.ADMIN_TOKEN }))' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          rm /tmp/secrets.json
